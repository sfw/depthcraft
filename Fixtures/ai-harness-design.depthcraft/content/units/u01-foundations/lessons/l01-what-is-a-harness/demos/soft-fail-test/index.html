<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soft-Fail Test</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
    }
  </style>
</head>
<body>
  <script type="module">
    // Attempt to import from nonexistent kit - should fail and trigger fallback
    const THREE = await import('kit:nonexistent-kit/three.module.min.js');
    
    // If we reach here, test FAILED - kit import should not succeed
    if (window.webkit?.messageHandlers?.demoError) {
      window.webkit.messageHandlers.demoError.postMessage('Test failure: invalid kit import succeeded');
    }
  </script>
</body>
</html>
