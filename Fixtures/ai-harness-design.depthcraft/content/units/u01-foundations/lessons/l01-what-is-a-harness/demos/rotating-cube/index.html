<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotating Cube Demo</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #1e3a8a 0%, #0f766e 100%);
    }
    #demo-container {
      width: 100%;
      height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="demo-container"></div>
  
  <!-- KIT_INJECT -->
  
  <script type="module">
    import * as THREE from './three.module.min.js';
    
    // Demo: Rotating cube to illustrate 3D coordinate system
    const container = document.getElementById('demo-container');
    
    // Scene setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);
    
    // Create a cube with colorful faces
    const geometry = new THREE.BoxGeometry(2, 2, 2);
    const materials = [
      new THREE.MeshBasicMaterial({ color: 0xff6b6b }), // right - red
      new THREE.MeshBasicMaterial({ color: 0x4ecdc4 }), // left - teal
      new THREE.MeshBasicMaterial({ color: 0xffe66d }), // top - yellow
      new THREE.MeshBasicMaterial({ color: 0x95e1d3 }), // bottom - mint
      new THREE.MeshBasicMaterial({ color: 0xaa96da }), // front - purple
      new THREE.MeshBasicMaterial({ color: 0xf38181 })  // back - pink
    ];
    const cube = new THREE.Mesh(geometry, materials);
    scene.add(cube);
    
    // Add edges for clarity
    const edges = new THREE.EdgesGeometry(geometry);
    const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
    const wireframe = new THREE.LineSegments(edges, lineMaterial);
    cube.add(wireframe);
    
    camera.position.z = 5;
    
    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      
      cube.rotation.x += 0.005;
      cube.rotation.y += 0.01;
      
      renderer.render(scene, camera);
    }
    
    // Handle resize
    function onWindowResize() {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }
    window.addEventListener('resize', onWindowResize);
    
    // Start animation
    animate();
    
    // Expose reset function for Reset button
    window.resetDemo = function() {
      cube.rotation.x = 0;
      cube.rotation.y = 0;
      camera.position.z = 5;
    };
  </script>
</body>
</html>
