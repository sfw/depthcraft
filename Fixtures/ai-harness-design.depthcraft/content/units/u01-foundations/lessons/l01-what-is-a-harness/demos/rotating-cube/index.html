<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotating Cube Demo</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #1e3a8a 0%, #0f766e 100%);
    }
    #demo-container {
      width: 100%;
      height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
    }
    #debug-status {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      background: rgba(0,0,0,0.8);
      color: #0f0;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      padding: 8px;
      border-radius: 4px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 1000;
    }
    #debug-status div {
      margin: 2px 0;
    }
  </style>
</head>
<body>
  <div id="debug-status"></div>
  <div id="demo-container"></div>
  
  <!-- KIT_INJECT -->
  
  <script type="module">
    // Debug logging helper
    function debugLog(msg) {
      console.log(`[CUBE DEMO] ${msg}`);
      const debugDiv = document.getElementById('debug-status');
      if (debugDiv) {
        debugDiv.innerHTML += `<div>${msg}</div>`;
      }
    }
    
    debugLog('Module script starting...');
    
    // Import Three.js
    let THREE;
    try {
      const module = await import('./three.module.min.js');
      THREE = module;
      debugLog('✅ Three.js imported successfully');
    } catch (error) {
      debugLog(`❌ Failed to import Three.js: ${error.message}`);
      if (window.webkit?.messageHandlers?.demoError) {
        window.webkit.messageHandlers.demoError.postMessage(`Three.js import failed: ${error.message}`);
      }
      throw error;
    }
    
    // Demo: Rotating cube to illustrate 3D coordinate system
    const container = document.getElementById('demo-container');
    debugLog(`Container found: ${!!container}`);
    
    let scene, camera, renderer, cube, geometry;
    
    // Defer init until container has non-zero size (layout complete)
    function initThreeJS() {
      const width = container.clientWidth;
      const height = container.clientHeight;
      
      debugLog(`Attempting init: container ${width}x${height}`);
      
      if (width === 0 || height === 0) {
        // Layout not ready, retry next frame
        requestAnimationFrame(initThreeJS);
        return;
      }
      
      debugLog(`✅ Container has size: ${width}x${height}`);
      
      try {
        // Scene setup with known dimensions
        scene = new THREE.Scene();
        debugLog('✅ Scene created');
        
        camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
        debugLog('✅ Camera created');
        
        // Try WebGL renderer
        try {
          renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
          debugLog('✅ WebGL renderer created');
        } catch (e) {
          debugLog(`❌ WebGL renderer failed: ${e.message}`);
          throw e;
        }
        
        renderer.setSize(width, height);
        debugLog(`✅ Renderer size set: ${width}x${height}`);
        
        renderer.setPixelRatio(window.devicePixelRatio);
        debugLog(`✅ Pixel ratio set: ${window.devicePixelRatio}`);
        
        container.appendChild(renderer.domElement);
        debugLog('✅ Canvas appended to container');
        
        // Log actual canvas dimensions
        const canvas = renderer.domElement;
        debugLog(`Canvas dimensions: ${canvas.width}x${canvas.height}, style: ${canvas.style.width}x${canvas.style.height}`);
        
        // Create a cube with colorful faces
        geometry = new THREE.BoxGeometry(2, 2, 2);
        const materials = [
          new THREE.MeshBasicMaterial({ color: 0xff6b6b }), // right - red
          new THREE.MeshBasicMaterial({ color: 0x4ecdc4 }), // left - teal
          new THREE.MeshBasicMaterial({ color: 0xffe66d }), // top - yellow
          new THREE.MeshBasicMaterial({ color: 0x95e1d3 }), // bottom - mint
          new THREE.MeshBasicMaterial({ color: 0xaa96da }), // front - purple
          new THREE.MeshBasicMaterial({ color: 0xf38181 })  // back - pink
        ];
        cube = new THREE.Mesh(geometry, materials);
        scene.add(cube);
        debugLog('✅ Cube created and added to scene');
        
        // Add edges for clarity
        const edges = new THREE.EdgesGeometry(geometry);
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
        const wireframe = new THREE.LineSegments(edges, lineMaterial);
        cube.add(wireframe);
        debugLog('✅ Wireframe edges added');
        
        camera.position.z = 5;
        debugLog('✅ Camera positioned at z=5');
        
        // Start animation
        debugLog('Starting animation loop...');
        animate();
        
        // Handle resize
        window.addEventListener('resize', onWindowResize);
        
        debugLog('🎉 Initialization complete!');
        
        // Hide debug status after success
        setTimeout(() => {
          const debugDiv = document.getElementById('debug-status');
          if (debugDiv) debugDiv.style.display = 'none';
        }, 3000);
        
      } catch (error) {
        debugLog(`❌ Init error: ${error.message}`);
        if (window.webkit?.messageHandlers?.demoError) {
          window.webkit.messageHandlers.demoError.postMessage(`Init failed: ${error.message}`);
        }
        throw error;
      }
    }
    
    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      
      if (cube) {
        cube.rotation.x += 0.005;
        cube.rotation.y += 0.01;
      }
      
      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }
    
    // Handle resize
    function onWindowResize() {
      if (!camera || !renderer) return;
      
      const width = container.clientWidth;
      const height = container.clientHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
      debugLog(`Resized to ${width}x${height}`);
    }
    
    // Expose reset function for Reset button
    window.resetDemo = function() {
      if (cube && camera) {
        cube.rotation.x = 0;
        cube.rotation.y = 0;
        camera.position.z = 5;
        debugLog('Demo reset');
      }
    };
    
    // Start initialization (deferred until layout)
    debugLog('Calling initThreeJS...');
    initThreeJS();
  </script>
</body>
</html>
