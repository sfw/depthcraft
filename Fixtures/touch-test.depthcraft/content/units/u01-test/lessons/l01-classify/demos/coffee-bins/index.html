<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Classification Demo</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: linear-gradient(135deg, #6B4423 0%, #3E2723 100%);
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #demo-container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="demo-container"></div>
  
  <script type="module">
    // Import UI Kit from app-bundled kit using kit: URL scheme
    try {
      await import('kit:ui-v0/kit.js');
      console.log('✅ UI Kit loaded:', window.DepthcraftUIKit);
    } catch (error) {
      if (window.webkit?.messageHandlers?.demoError) {
        window.webkit.messageHandlers.demoError.postMessage(`Kit import failed: ${error.message}`);
      }
      throw error;
    }
    
    // Demo: Classify coffee shop names by concept
    // This tests the tap-select → tap-place pattern (no HTML5 DnD)
    const coffeeDemo = DepthcraftUIKit.createClassifyBins({
      containerId: 'demo-container',
      learningGoal: 'Practice divergent-convergent thinking by classifying coffee shop names',
      items: [
        { id: 'daily-bean', text: 'The Daily Bean' },
        { id: 'brew-ha-ha', text: 'Brew Ha Ha' },
        { id: 'caffe-luna', text: 'Caffè Luna' },
        { id: 'daily-grind', text: 'Daily Grind' },
        { id: 'steam-story', text: 'Steam & Story' },
        { id: 'sunrise-sips', text: 'Sunrise Sips' },
        { id: 'bean-bloom', text: 'Bean & Bloom' },
        { id: 'brewtiful', text: 'Brewtiful Mornings' },
        { id: 'dolce-vita', text: 'Dolce Vita Coffee' },
        { id: 'perk-up', text: 'Perk Up' },
        { id: 'steaming-cup', text: 'The Steaming Cup' },
        { id: 'morning-ritual', text: 'Morning Ritual' },
        { id: 'bean-counter', text: 'Bean Counter' },
        { id: 'brew-crew', text: 'The Brew Crew' },
        { id: 'casa-caffe', text: 'Casa Caffè' },
        { id: 'grounds-thought', text: 'Grounds for Thought' },
        { id: 'steamhouse', text: 'Steamhouse Coffee' },
        { id: 'first-light', text: 'First Light Coffee' },
        { id: 'full-beans', text: 'Full of Beans' },
        { id: 'brewed-awake', text: 'Brewed Awakening' },
        { id: 'amore-espresso', text: 'Amore Espresso' },
        { id: 'grind-house', text: 'The Grind House' },
        { id: 'first-steam', text: 'First Steam' },
        { id: 'daybreak', text: 'Daybreak Roasters' }
      ],
      bins: [
        { id: 'time', label: 'Time/Daily Routine' },
        { id: 'pun', label: 'Coffee Puns' },
        { id: 'european', label: 'European/Romantic' },
        { id: 'descriptive', label: 'Descriptive/Literal' },
        { id: 'community', label: 'Community/Place' },
        { id: 'process', label: 'Coffee Process' }
      ],
      correctBins: {
        'daily-bean': 'time',
        'brew-ha-ha': 'pun',
        'caffe-luna': 'european',
        'daily-grind': 'time',
        'steam-story': 'community',
        'sunrise-sips': 'time',
        'bean-bloom': 'descriptive',
        'brewtiful': 'pun',
        'dolce-vita': 'european',
        'perk-up': 'pun',
        'steaming-cup': 'descriptive',
        'morning-ritual': 'time',
        'bean-counter': 'pun',
        'brew-crew': 'community',
        'casa-caffe': 'european',
        'grounds-thought': 'pun',
        'steamhouse': 'descriptive',
        'first-light': 'time',
        'full-beans': 'pun',
        'brewed-awake': 'pun',
        'amore-espresso': 'european',
        'grind-house': 'process',
        'first-steam': 'time',
        'daybreak': 'time'
      }
    });
    
    // Expose reset for demo controls
    window.resetDemo = function() {
      coffeeDemo.reset();
    };
  </script>
</body>
</html>
