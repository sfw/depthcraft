name: DepthcraftReader
options:
  bundleIdPrefix: dev.depthcraft
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "2" # iPad
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  DepthcraftReader:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/demo-kits
        type: folder
        buildPhase: resources
        name: demo-kits
      - path: ../../Fixtures/ai-harness-design.depthcraft
        type: folder
        buildPhase: resources
        name: Fixtures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.depthcraft.reader
        PRODUCT_NAME: DepthcraftReader
        INFOPLIST_GENERATION_MODE: GeneratedFile
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: Depthcraft
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
    scheme:
      testTargets:
        - DepthcraftReaderTests
  
  DepthcraftReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: DepthcraftReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.depthcraft.reader.tests
        GENERATE_INFOPLIST_FILE: YES
